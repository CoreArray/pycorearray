[build-system]
requires = ["setuptools>=77", "numpy>=1.20"]
build-backend = "setuptools.build_meta"

[project]
name = "pycorearray"
version = "0.2.0"
description = "Python Interface to CoreArray Genomic Data Structure (GDS) Files"
readme = "README.md"
requires-python = ">=3.8"
# pycorearray: GPL-3.0; bundled CoreArray: LGPL-3.0; LZ4/xxHash: BSD-2-Clause; zlib: Zlib
license = "GPL-3.0-only AND LGPL-3.0-only AND BSD-2-Clause AND Zlib"
license-files = ["LICENSE", "src/LZ4/LICENSE", "src/ZLIB/LICENSE"]
authors = [
    { name = "Xiuwen Zheng", email = "zhengxwen@gmail.com" },
]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/CoreArray/pycorearray"

[tool.setuptools]
packages = ["pycorearray"]

[tool.setuptools.package-data]
pycorearray = ["include/*.h", "data/*.gds"]
