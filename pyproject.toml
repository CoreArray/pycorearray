[build-system]
# building against NumPy 2.x headers gives a binary that also runs on NumPy 1.x
requires = ["setuptools>=77", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycorearray"
version = "0.2.0"
description = "Python Interface to CoreArray Genomic Data Structure (GDS) Files"
readme = "README.md"
requires-python = ">=3.10"
# pycorearray: GPL-3.0; bundled CoreArray: LGPL-3.0; LZ4/xxHash: BSD-2-Clause; zlib: Zlib
license = "GPL-3.0-only AND LGPL-3.0-only AND BSD-2-Clause AND Zlib"
license-files = ["LICENSE", "src/CoreArray/LICENSE", "src/LZ4/LICENSE", "src/ZLIB/LICENSE"]
authors = [
    { name = "Xiuwen Zheng", email = "zhengxwen@gmail.com" },
]
keywords = ["GDS", "CoreArray", "gdsfmt", "genomics", "bioinformatics",
    "array storage", "compression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# must match NPY_TARGET_VERSION in setup.py
dependencies = ["numpy>=1.25"]

[project.urls]
Homepage = "https://github.com/CoreArray/pycorearray"
Issues = "https://github.com/CoreArray/pycorearray/issues"

[tool.setuptools]
packages = ["pycorearray", "pycorearray.data", "pycorearray.include"]

[tool.setuptools.package-data]
"pycorearray.data" = ["*.gds"]
"pycorearray.include" = ["*.h"]

# wheels: .github/workflows/wheels.yml
[tool.cibuildwheel]
# no free-threaded builds, no musllinux
skip = ["cp3??t-*", "*-musllinux_*"]
test-requires = ["pytest"]
test-sources = ["tests", "tools/wheels/check_https.py"]
test-command = [
    "python -c \"import pycorearray; assert pycorearray.cloud.available()\"",
    "python -m pytest tests",
    "python tools/wheels/check_https.py",
]

[tool.cibuildwheel.linux]
archs = ["auto64"]
before-all = "sh tools/wheels/build-deps-linux.sh"
# no debug information (-g in the CFLAGS of Python), which is 90% of the size
environment = { OPENSSL_PREFIX = "/usr/local", CFLAGS = "-g0", CXXFLAGS = "-g0" }

[tool.cibuildwheel.macos]
before-all = "sh tools/wheels/build-xz-macos.sh /tmp/xz"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", LZMA_PREFIX = "/tmp/xz" }
