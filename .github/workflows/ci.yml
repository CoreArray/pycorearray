name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libcurl and OpenSSL (for cloud access)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      # macOS: libcurl and CommonCrypto come with the system
      - name: Install liblzma
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
        run: brew install xz

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools numpy pytest

      - name: Build & install pycorearray (C extension)
        run: pip install .

      # otherwise the cloud tests would all be skipped; run outside the source
      # tree so that the installed package is imported
      - name: Check that cloud access is built
        working-directory: ${{ runner.temp }}
        run: python -c "import pycorearray; assert pycorearray.cloud.available()"

      - name: Run tests
        run: pytest tests/ -v

  test-nocloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools numpy pytest

      - name: Build & install pycorearray without cloud access
        env:
          PYCOREARRAY_NO_CLOUD: 1
        run: pip install .

      - name: Check that cloud access is not built
        working-directory: ${{ runner.temp }}
        run: python -c "import pycorearray; assert not pycorearray.cloud.available()"

      - name: Run tests
        run: pytest tests/ -v
